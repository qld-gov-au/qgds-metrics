name: Build dashboard

# Collects Figma Library Analytics, exports the snapshot from Supabase, builds the
# dashboard and uploads it to the private metrics-data bucket. Runs monthly, and when
# `npm run monthly` starts it after a crawl.
#
# It does not crawl websites. Many sites block requests from cloud data centres such as
# GitHub's runners, so crawls run from a work network with `npm run monthly`.
#
# This repository is public. Logs show counts, durations and error types only,
# and nothing is uploaded to GitHub. Do not add actions/upload-artifact or Pages.

on:
  # 17:00 UTC on the 1st is 3 am on the 2nd in Brisbane.
  schedule:
    - cron: "0 17 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-dashboard
  cancel-in-progress: false

jobs:
  build:
    # Never run on forks, which have no access to the data.
    if: github.repository == 'qld-gov-au/qgds-metrics'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Install scripts are off, so no dependency code runs before the secrets are in use.
      - run: npm ci --ignore-scripts

      - run: npm run check:no-data

      - name: Collect Figma analytics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_LIBRARY_FILE_KEY: ${{ secrets.FIGMA_LIBRARY_FILE_KEY }}
        run: npm run figma

      - name: Export snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run export

      - run: npm run dashboard:build

      - name: Upload to private storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run dashboard:upload
